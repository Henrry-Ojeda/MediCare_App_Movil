name: Build PROD Release - MediCare App Movil (Requiere Autorización)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-approval-gate:
    name: Esperando Autorización Manual de Producción
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirmar build autorizado de Producción
        run: echo "Build de Producción aprobado por ${{ github.actor }}."

  build-prod-apk:
    name: Compilar APK / AAB Producción
    needs: production-approval-gate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar estructura nativa Android si falta
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.medicare --project-name medicare_doctor_app .
          fi
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          perms = []
          if "android.permission.INTERNET" not in txt:
              perms.append('    <uses-permission android:name="android.permission.INTERNET" />')
          if "android.permission.USE_BIOMETRIC" not in txt:
              perms.append('    <uses-permission android:name="android.permission.USE_BIOMETRIC" />')
          if perms:
              txt = re.sub(r'(<application\b)', "\n".join(perms) + r'\n    \1', txt, count=1)
          if "usesCleartextTraffic" not in txt:
              txt = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', txt, count=1)
          p.write_text(txt, encoding="utf-8")
          assert "android.permission.INTERNET" in txt, "Missing INTERNET permission"
          assert "usesCleartextTraffic" in txt, "Missing usesCleartextTraffic"
          print(txt)
          PY
      - run: flutter pub get
      - name: Build APK Producción
        run: |
          flutter build apk --release \
            --dart-define=MEDICARE_ENV=production \
            --dart-define=MEDICARE_API_URL=${{ vars.PROD_MEDICARE_API_URL || 'https://medi-care-ebon.vercel.app/api' }}
      - name: Subir APK Producción
        uses: actions/upload-artifact@v4
        with:
          name: medicare-doctor-prod-apk
          path: build/app/outputs/flutter-apk/app-release.apk

