name: Build PROD Release - MediCare App Movil (Requiere Autorización)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-approval-gate:
    name: Esperando Autorización Manual de Producción
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Confirmar build autorizado de Producción
        run: echo "Build de Producción aprobado por ${{ github.actor }}."

  build-prod-apk:
    name: Compilar APK / AAB Producción
    needs: production-approval-gate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar estructura nativa Android si falta
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.medicare --project-name medicare_doctor_app .
          fi
      - run: flutter pub get
      - name: Build APK Producción
        run: |
          flutter build apk --release \
            --dart-define=MEDICARE_ENV=production \
            --dart-define=MEDICARE_API_URL=${{ vars.PROD_MEDICARE_API_URL || 'https://api.medicare.local/api' }}
      - name: Subir APK Producción
        uses: actions/upload-artifact@v4
        with:
          name: medicare-doctor-prod-apk
          path: build/app/outputs/flutter-apk/app-release.apk
