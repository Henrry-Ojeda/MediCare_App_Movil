name: Build QA APK - MediCare App Movil

on:
  push:
    branches: [qa]
  workflow_dispatch:

jobs:
  build-qa-apk:
    name: Compilar APK QA
    runs-on: ubuntu-latest
    environment:
      name: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generar estructura nativa Android si falta
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.medicare --project-name medicare_doctor_app .
          fi
      - run: flutter pub get
      - name: Build APK QA
        run: |
          flutter build apk --release \
            --dart-define=MEDICARE_ENV=qa \
            --dart-define=MEDICARE_API_URL=${{ vars.QA_MEDICARE_API_URL || 'https://qa-api.medicare.local/api' }}
      - name: Subir APK QA
        uses: actions/upload-artifact@v4
        with:
          name: medicare-doctor-qa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
