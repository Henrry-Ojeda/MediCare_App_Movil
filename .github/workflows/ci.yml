name: CI - MediCare App Movil (Flutter & Promotion Gate)

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

jobs:
  promotion-gate:
    name: Validar Flujo de Promoción (DEV -> QA -> PROD)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rama origen permitida
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR desde '$HEAD' hacia '$BASE'"
          if [ "$BASE" = "main" ]; then
            if [[ "$HEAD" != "qa" && "$HEAD" != hotfix/* ]]; then
              echo "ERROR: No se permite pasar directo a PRODUCCION (main) desde '$HEAD'. Debe pasar primero por 'qa' (o 'hotfix/*')."
              exit 1
            fi
          fi
          if [ "$BASE" = "qa" ]; then
            if [[ "$HEAD" != "develop" && "$HEAD" != release/* && "$HEAD" != hotfix/* ]]; then
              echo "ERROR: A 'qa' solo se promueve desde 'develop', 'release/*' o 'hotfix/*'."
              exit 1
            fi
          fi

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
